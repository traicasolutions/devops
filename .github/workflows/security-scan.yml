name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run backend tests with coverage
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests --cov=backend/app --cov-report=xml:coverage.xml

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  trivy-filesystem:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show readable filesystem scan report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
          hide-progress: true

      - name: Generate filesystem scan SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          hide-progress: true

      - name: Upload filesystem scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem

  trivy-backend-image:
    name: Trivy Backend Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t todo-backend:${{ github.sha }} ./backend

      - name: Show readable backend image scan report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: todo-backend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
          hide-progress: true

      - name: Generate backend image scan SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: todo-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend-image-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          hide-progress: true

      - name: Upload backend image scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend-image-results.sarif
          category: trivy-backend-image

  trivy-frontend-image:
    name: Trivy Frontend Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -t todo-frontend:${{ github.sha }} ./frontend

      - name: Show readable frontend image scan report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: todo-frontend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
          hide-progress: true

      - name: Generate frontend image scan SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: todo-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend-image-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          hide-progress: true

      - name: Upload frontend image scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend-image-results.sarif
          category: trivy-frontend-image
